<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Service Bee - Manage Services</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Service Bee (Provider)</div>
        <div class="nav-links">
            <!-- Links injected by script.js -->
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>My Services</h2>
            <button onclick="openServiceModal()"
                style="background: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">+
                Add New Service</button>
        </div>

        <div id="my-services-list" class="service-grid">
            <p>Loading services...</p>
        </div>
    </div>

    <!-- Add/Edit Service Modal -->
    <div id="serviceModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeServiceModal()">&times;</span>
            <h3 id="serviceModalTitle">Add Service</h3>
            <form id="serviceForm">
                <input type="hidden" id="serviceId">

                <label>Title</label>
                <input type="text" id="serviceTitle" required>

                <label>Category</label>
                <select id="serviceCategory" required>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Moving">Moving</option>
                </select>

                <label>Description</label>
                <textarea id="serviceDesc" rows="3" style="width:100%; margin-bottom: 10px;" required></textarea>

                <label>Price ($)</label>
                <input type="number" id="servicePrice" required>

                <label>Location</label>
                <input type="text" id="serviceLocation" required>

                <button type="submit">Save Service</button>
            </form>
        </div>
    </div>

    <script src="script.js?v=1"></script>
</body>

</html>
