<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Service Bee - Provider Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Service Bee (Provider)</div>
        <div class="nav-links">
            <!-- Links injected by script.js -->
        </div>
    </nav>

    <div class="container">
        <h2>New Booking Requests (Pending)</h2>
        <div id="provider-bookings-pending" class="booking-list">
            <p>Loading pending bookings...</p>
        </div>

        <h2 style="margin-top: 40px;">Confirmed Bookings</h2>
        <div id="provider-bookings-confirmed" class="booking-list">
            <p>Loading confirmed bookings...</p>
        </div>

        <h2 style="margin-top: 40px;">Booking History (Completed/Rejected)</h2>
        <div id="provider-bookings-completed" class="booking-list">
            <p>Loading history...</p>
        </div>

        <h2 style="margin-top: 40px;">My Reviews</h2>
        <div id="provider-reviews" class="service-grid">
            <p>Loading reviews...</p>
        </div>
    </div>



    <script src="script.js?v=1"></script>
</body>

</html>
